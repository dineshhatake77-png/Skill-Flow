<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#121824" stop-opacity="1"/>
      <stop offset="60%" stop-color="#07090E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#040508" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.25)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.18)"/>
      <stop offset="100%" stop-color="rgba(255, 107, 0, 0.15)"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>
  
  <!-- 3D Topographic Contour Lines Mapping -->
  <g fill="none" stroke="url(#cyanGlow)" filter="url(#blurGlow)" opacity="0.85">
    <!-- Peak 1 Outer Rings -->
    <path stroke-width="1.5" d="M -100 1100 C 300 900, 600 1200, 1000 850 C 1400 500, 1700 950, 2100 700" />
    <path stroke-width="1.5" d="M -100 1050 C 280 860, 580 1150, 970 810 C 1370 470, 1660 900, 2100 650" />
    <path stroke-width="1.8" d="M -100 1000 C 260 820, 560 1100, 940 770 C 1340 440, 1620 850, 2100 600" />
    <path stroke-width="2.0" d="M -100 950 C 240 780, 540 1050, 910 730 C 1310 410, 1580 800, 2100 550" />
    
    <!-- Concentric Elevation Circles (Topographic Mountain Peaks) -->
    <path stroke-width="2.2" d="M 600 700 C 650 550, 900 500, 1100 650 C 1250 780, 1000 950, 750 900 C 550 860, 550 780, 600 700 Z" />
    <path stroke-width="2.2" d="M 640 680 C 680 560, 880 520, 1060 640 C 1190 750, 980 900, 770 860 C 600 830, 600 750, 640 680 Z" />
    <path stroke-width="2.5" d="M 680 660 C 710 570, 860 540, 1020 630 C 1130 720, 950 850, 790 820 C 640 800, 640 730, 680 660 Z" />
    <path stroke-width="2.5" d="M 720 640 C 740 580, 840 560, 970 620 C 1070 690, 920 800, 810 780 C 700 760, 680 700, 720 640 Z" />
    <path stroke-width="2.8" d="M 760 620 C 770 590, 830 570, 930 610 C 1010 660, 890 750, 820 740 C 740 730, 730 670, 760 620 Z" />
    <path stroke-width="3.0" d="M 800 610 C 810 595, 840 585, 890 605 C 940 635, 870 700, 830 690 C 780 680, 780 640, 800 610 Z" />
    <ellipse cx="845" cy="635" rx="25" ry="18" stroke-width="3.2" />

    <!-- Secondary Topo Peak (Top Right) -->
    <path stroke-width="1.6" d="M 1200 400 C 1300 250, 1600 200, 1750 350 C 1850 480, 1650 600, 1450 550 C 1300 510, 1150 480, 1200 400 Z" />
    <path stroke-width="1.8" d="M 1240 390 C 1320 270, 1570 230, 1710 350 C 1800 450, 1620 550, 1440 510 C 1320 480, 1190 450, 1240 390 Z" />
    <path stroke-width="2.0" d="M 1280 380 C 1340 290, 1540 260, 1670 350 C 1740 420, 1580 500, 1430 470 C 1340 450, 1240 420, 1280 380 Z" />
    <path stroke-width="2.4" d="M 1320 370 C 1360 310, 1500 290, 1620 350 C 1680 400, 1540 460, 1420 440 C 1350 420, 1280 390, 1320 370 Z" />
    <ellipse cx="1450" cy="380" rx="40" ry="25" stroke-width="2.8" />
    <ellipse cx="1450" cy="380" rx="20" ry="12" stroke-width="3.0" />

    <!-- Flowing Terrain Waves (Bottom Left to Center) -->
    <path stroke-width="1.4" d="M -200 400 C 200 200, 400 600, 800 300 C 1200 0, 1500 400, 2000 100" />
    <path stroke-width="1.4" d="M -200 450 C 200 250, 400 650, 800 350 C 1200 50, 1500 450, 2000 150" />
    <path stroke-width="1.6" d="M -200 500 C 200 300, 400 700, 800 400 C 1200 100, 1500 500, 2000 200" />
    <path stroke-width="1.8" d="M -200 550 C 200 350, 400 750, 800 450 C 1200 150, 1500 550, 2000 250" />
    <path stroke-width="2.0" d="M -200 600 C 200 400, 400 800, 800 500 C 1200 200, 1500 600, 2000 300" />
  </g>

  <!-- Fine Noise Grid Overlay -->
  <rect width="1920" height="1080" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
</svg>
